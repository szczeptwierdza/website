
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorem ipsum — Version 05</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --paper: #f3f0e8;
  --ink: #24251f;
  --olive: #62694f;
  --line: rgba(36,37,31,.25);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "DM Sans", sans-serif;
  overflow-x: hidden;
}

img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1400px, calc(100% - 90px));
  margin: auto;
}

/* HEADER */

header {
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
}

.brand-icon {
  height: 37px;
  width: 37px;
  border: 1px solid var(--ink);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 22px;
  transition: .3s;
}

.brand:hover .brand-icon {
  transform: rotate(90deg);
  background: var(--ink);
  color: white;
}

nav {
  display: flex;
  align-items: center;
  gap: 25px;
  font-size: 12px;
}

nav a {
  opacity: .7;
  transition: opacity .3s;
}

nav a:hover { opacity: 1; }

/* INTRO PHOTO */

.intro {
  padding: 35px 0 70px;
}

.intro-photo {
  height: min(690px, 70vw);
  min-height: 380px;
  overflow: hidden;
  border-radius: 0 0 190px 190px;
  position: relative;
}

.intro-photo img {
  transition: transform 1.2s;
}

.intro-photo:hover img {
  transform: scale(1.025);
}

.intro-photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    transparent 65%,
    rgba(0,0,0,.12)
  );
  pointer-events: none;
}

/* PHOTO COLLECTION */

.photo-section {
  padding: 35px 0 100px;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 22px;
  align-items: start;
}

.photo {
  position: relative;
  overflow: hidden;
  background: #d6d5ca;
}

.photo img {
  transition: transform 1s cubic-bezier(.2,.7,.2,1);
}

.photo:hover img {
  transform: scale(1.055);
}

/* ROW ONE */

.photo-forest {
  grid-column: 1 / 8;
  height: 430px;
  border-radius: 180px 180px 0 0;
}

.photo-fire {
  grid-column: 9 / 13;
  height: 310px;
  border-radius: 50%;
  margin-top: 65px;
}

/* ROW TWO */

.photo-mountain {
  grid-column: 1 / 5;
  height: 390px;
  border-radius: 0 0 180px 180px;
  margin-top: 25px;
}

.photo-tent {
  grid-column: 6 / 13;
  height: 430px;
  border-radius: 220px 0 220px 0;
}

/* FULL WIDTH PHOTO */

.wide-photo {
  height: 530px;
  overflow: hidden;
  border-radius: 220px 0 220px 0;
  margin: 15px 0 100px;
}

.wide-photo img {
  transition: transform 1.2s;
}

.wide-photo:hover img {
  transform: scale(1.035);
}

/* PROJECTS */

.projects {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  align-items: center;
  padding-bottom: 110px;
}

.project-main {
  height: 510px;
  border-radius: 220px 220px 0 0;
}

.project-secondary {
  height: 340px;
  border-radius: 0 180px 0 180px;
  margin-top: 70px;
}

/* CAMP */

.camp-grid {
  display: grid;
  grid-template-columns: 1.15fr .85fr 1fr;
  gap: 22px;
  align-items: center;
  padding-bottom: 110px;
}

.camp-one {
  height: 360px;
  border-radius: 50% 50% 0 0;
}

.camp-two {
  height: 285px;
  border-radius: 50%;
}

.camp-three {
  height: 360px;
  border-radius: 0 0 180px 180px;
}

/* FINAL PHOTO */

.final-photo {
  height: 480px;
  overflow: hidden;
  border-radius: 220px 220px 0 0;
  margin-bottom: 85px;
}

/* FOOTER */

footer {
  min-height: 85px;
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
}

.footer-mark {
  display: flex;
  align-items: center;
  gap: 12px;
}

.footer-circle {
  width: 35px;
  height: 35px;
  border: 1px solid var(--ink);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 20px;
}

.footer-line {
  flex: 1;
  height: 1px;
  background: var(--line);
  margin: 0 35px;
}

/* ANIMATIONS */

.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity .9s ease, transform .9s ease;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

/* RESPONSIVE */

@media(max-width: 850px) {
  .container {
    width: calc(100% - 50px);
  }

  .photo-grid {
    gap: 15px;
  }

  .photo-forest { height: 330px; }
  .photo-fire { height: 230px; }
  .photo-mountain { height: 300px; }
  .photo-tent { height: 330px; }

  .wide-photo { height: 400px; }

  .project-main { height: 390px; }
  .project-secondary { height: 270px; }

  .camp-one, .camp-three { height: 290px; }
  .camp-two { height: 230px; }
}

@media(max-width: 600px) {
  .container {
    width: calc(100% - 30px);
  }

  header { height: 68px; }

  nav { gap: 14px; }
  nav a:nth-child(2) { display: none; }

  .intro {
    padding-top: 20px;
    padding-bottom: 45px;
  }

  .intro-photo {
    height: 480px;
    min-height: 0;
    border-radius: 0 0 100px 100px;
  }

  .photo-section { padding-bottom: 65px; }

  .photo-grid {
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .photo-forest {
    grid-column: 1 / 3;
    height: 310px;
    border-radius: 130px 130px 0 0;
  }

  .photo-fire {
    grid-column: 1;
    height: 190px;
    margin-top: 0;
  }

  .photo-mountain {
    grid-column: 2;
    height: 240px;
    margin-top: 30px;
  }

  .photo-tent {
    grid-column: 1 / 3;
    height: 300px;
    border-radius: 130px 0 130px 0;
  }

  .wide-photo {
    height: 310px;
    border-radius: 120px 0 120px 0;
    margin-bottom: 65px;
  }

  .projects {
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding-bottom: 65px;
  }

  .project-main {
    height: 290px;
    border-radius: 130px 130px 0 0;
  }

  .project-secondary {
    height: 220px;
    margin-top: 45px;
    border-radius: 0 100px 0 100px;
  }

  .camp-grid {
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    padding-bottom: 65px;
  }

  .camp-one {
    height: 240px;
  }

  .camp-two {
    height: 190px;
    margin-top: 35px;
  }

  .camp-three {
    grid-column: 1 / 3;
    height: 280px;
    border-radius: 0 0 120px 120px;
  }

  .final-photo {
    height: 320px;
    border-radius: 130px 130px 0 0;
    margin-bottom: 55px;
  }

  footer {
    gap: 12px;
    flex-wrap: wrap;
    padding: 18px 0;
  }

  .footer-line {
    margin: 0 8px;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }

  .reveal {
    opacity: 1;
    transform: none;
  }
}
</style>
</head>

<body>

<div class="container">
<header>
  <a href="#" class="brand">
    <span class="brand-icon">+</span>
    <span>Lorem ipsum</span>
  </a>

  <nav>
    <a href="#photos">Lorem</a>
    <a href="#projects">Ipsum</a>
    <a href="#camp">Dolor</a>
  </nav>
</header>
</div>

<main>

<!-- DUŻE ZDJĘCIE OTWIERAJĄCE -->

<section class="intro container">
  <div class="intro-photo reveal">
    <img
      src="https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?auto=format&fit=crop&w=2000&q=90"
      alt="Lorem ipsum">
  </div>
</section>

<!-- OGNISKA, NATURA, BIWAK -->

<section class="photo-section container" id="photos">
  <div class="photo-grid">

    <div class="photo photo-forest reveal">
      <img
        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1300&q=85"
        alt="Lorem ipsum">
    </div>

    <div class="photo photo-fire reveal">
      <img
        src="https://images.unsplash.com/photo-1475483768296-6163e08872a1?auto=format&fit=crop&w=900&q=85"
        alt="Lorem ipsum">
    </div>

    <div class="photo photo-mountain reveal">
      <img
        src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1000&q=85"
        alt="Lorem ipsum">
    </div>

    <div class="photo photo-tent reveal">
      <img
        src="https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?auto=format&fit=crop&w=1300&q=85"
        alt="Lorem ipsum">
    </div>

  </div>
</section>

<!-- WĘDRÓWKI I WYJAZDY -->

<div class="container">
  <div class="wide-photo reveal">
    <img
      src="https://images.unsplash.com/photo-1551632811-561732d1e306?auto=format&fit=crop&w=1800&q=90"
      alt="Lorem ipsum">
  </div>
</div>

<!-- PROJEKTY I ZBIÓRKI -->

<section class="projects container" id="projects">

  <div class="photo project-main reveal">
    <img
      src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1100&q=85"
      alt="Lorem ipsum">
  </div>

  <div class="photo project-secondary reveal">
    <img
      src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1000&q=85"
      alt="Lorem ipsum">
  </div>

</section>

<!-- ŻYCIE OBOZOWE -->

<section class="camp-grid container" id="camp">

  <div class="photo camp-one reveal">
    <img
      src="https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=900&q=85"
      alt="Lorem ipsum">
  </div>

  <div class="photo camp-two reveal">
    <img
      src="https://images.unsplash.com/photo-1510798831971-661eb04b3739?auto=format&fit=crop&w=900&q=85"
      alt="Lorem ipsum">
  </div>

  <div class="photo camp-three reveal">
    <img
      src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1000&q=85"
      alt="Lorem ipsum">
  </div>

</section>

<!-- ZDJĘCIE ZAMYKAJĄCE -->

<div class="container">
  <div class="final-photo reveal">
    <img
      src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=90"
      alt="Lorem ipsum">
  </div>
</div>

</main>

<div class="container">
<footer>
  <a href="#" class="footer-mark">
    <span class="footer-circle">+</span>
    <span>Lorem ipsum</span>
  </a>

  <div class="footer-line"></div>

  <span>Lorem ipsum</span>
</footer>
</div>

<script>
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("visible");
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });

document.querySelectorAll(".reveal").forEach(el => {
  observer.observe(el);
});
</script>

</body>
</html>
